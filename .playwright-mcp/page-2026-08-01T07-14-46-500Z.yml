    - generic [ref=f2e221]:
      - heading "The ARR figure being used externally does not match the CFO's" [level=4] [ref=f2e222]
      - paragraph [ref=f2e223]: In three conversations between 29 and 31 July the company was described to a strategic acquirer and two growth-equity firms as having $700,000 of ARR — and, earlier in the same Harris call, "around one million." Level Equity was told "seven hundred to eight hundred."
      - paragraph [ref=f2e224]: The CFO's client master gives $388,692 of ARR from 37 paying districts. The company's own CFO dashboard independently states $383,796 implied ARR at the July run rate. Those two agree. The external figure is $311,308 higher — 1.8× the sourced number.
      - paragraph [ref=f2e225]: The most likely reconciliation is that the external figure adds open renewal pipeline to booked ARR. That is a definitional choice, not a falsehood — but it is not the definition a buyer will use, and the first diligence request will surface the gap. The same pattern appears on Conroe, described externally as $235,000 over 83,000 students and as $230,000 over 80,000 students on consecutive days, against a contracted $206,785 over 72,556 students in both the model and the CRM.
      - paragraph [ref=f2e226]: The board should settle one ARR definition and one Conroe figure before any further buyer contact. Level Equity and Growth Street operate in the same K-12 vertical and discussed each other's portfolio companies on these very calls.
    - generic [ref=f2e227]:
      - heading "What was planned versus what happened" [level=4] [ref=f2e228]
      - paragraph [ref=f2e229]: The sales plan of record for 2026 targeted $465,000 of new ARR between January and August (Commission Proposal r33) against a $1M ARR by 31 August milestone (r18). The sales lead's own written proposal put May–August revenue at $800,000–$950,000 (R-Rev Target r44).
      - paragraph [ref=f2e230]: Actual collections May–July were $31,397. That is roughly 4% of the low end of that range. This gap is the single most important input to any forward forecast, and it is why every scenario below discounts pipeline heavily.
