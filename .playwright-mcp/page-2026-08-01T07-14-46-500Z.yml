    - heading "Cost levers — what \"cut to the bone\" actually means" [level=2] [ref=f2e1698]
    - paragraph [ref=f2e1699]: The board should see the names and the numbers, because these are the decisions. Nine people and vendors carry $64,741 a month. The "keep" column below is one defensible minimum — the people who hold the product and the renewal book — not a recommendation the board has approved.
