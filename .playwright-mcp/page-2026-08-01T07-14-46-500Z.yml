    - heading "The decisions this board actually has to make" [level=3] [ref=f2e2062]
    - generic [ref=f2e2063]:
      - generic [ref=f2e2064]:
        - generic [ref=f2e2065]: Decision 1 · The authorization being requested
        - generic [ref=f2e2066]: The board update asks the board to "authorize Steve and me to move forward with formal, confidential conversations aimed at a sale, acquisition, or partnership … No definitive action — a term sheet, LOI, or binding agreement — would be signed without bringing it back to the full board. This is an ask to explore, not to commit." Nothing in the data argues against granting it. The question is what else is decided in the same meeting, because authorization alone changes no cash flow.
      - generic [ref=f2e2067]:
        - generic [ref=f2e2068]: Decision 2 · Cut now, or don't
        - generic [ref=f2e2069]: This is the decision with the largest effect on every other option, and it is currently unresolved between the CEO and the Chairman. Cutting to the skeleton base moves the break-even bar from $88,381/mo to $30,140/mo, and moves required pipeline conversion from 35.9% — above the demonstrated 24% win rate — to 12.3%, well below it. It is the only lever on the table that changes the shape of the outcome rather than the timing.
      - generic [ref=f2e2070]:
        - generic [ref=f2e2071]: Decision 3 · Bridge, and on what condition
        - generic [ref=f2e2072]: "The Chairman's written position: \"We are not considering a bridge financing option at this time … I'm not comfortable raising the prospect of additional bridge financing absent a high-confidence path to closing a sale or partnership.\" The condition is therefore already stated. Note the tension the board should resolve explicitly: the CEO separately told an acquirer that investors \"will probably keep us going … if it takes three more months and they see a pathway to an end.\" Those two positions cannot both be the company's position."
      - generic [ref=f2e2073]:
        - generic [ref=f2e2074]: Decision 4 · What "wind-down" means in practice
        - generic [ref=f2e2075]: The Chairman's stated first obligation is "figuring out how to responsibly address districts currently under active one-year contracts with us, rather than leaving them without a path forward." That obligation is a real constraint on timing and on any asset sale, and it has not been costed. No wind-down estimate exists in the financial file. The figure used in scenario S5 is illustrative only.
    - generic [ref=f2e2076]:
      - heading "The sequencing problem, in the Chairman's own words" [level=4] [ref=f2e2077]
      - paragraph [ref=f2e2078]: "\"If it's going to take ninety days to get a deal done and that is fast, you don't have ninety days.\" — said on 29 July against a 30 September runway, which was 62 days out then and is 60 days out today."
      - paragraph [ref=f2e2079]: That arithmetic is the whole board meeting. A sale process cannot outrun the cash unless the cash is made to last longer, which means the cut is not an alternative to the sale process — it is the precondition for one. Cutting to the skeleton base pushes zero cash from September into spring, which is the only way any of the five avenues gets enough time to reach a term sheet.
