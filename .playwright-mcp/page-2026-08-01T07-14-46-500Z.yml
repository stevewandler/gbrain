    - generic [ref=f2e1713]:
      - heading "Why the cut is what makes the plan possible" [level=4] [ref=f2e1714]
      - paragraph [ref=f2e1715]: To break even on the current cost base, 35.9% of the open pipeline must convert to cash within four months. The demonstrated win rate on decided deals, by value and excluding Conroe, is 24%. The plan requires beating the historical rate by half again.
      - paragraph [ref=f2e1716]: On the skeleton cost base, the same calculation needs 12.3% — comfortably inside what this team has already proven it can do. The cut does not merely extend runway. It moves the target from above the demonstrated win rate to well below it. That is the difference between a hope and a plan.
