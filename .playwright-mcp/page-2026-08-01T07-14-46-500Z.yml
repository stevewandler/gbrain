      - heading "Conroe's cash is already spent" [level=4] [ref=f2e165]
      - paragraph [ref=f2e166]: The Conroe contract is $206,785. It was collected net of a 25% ESC fee as a single $155,088 payment on 16 April 2026 — traceable in the bank record as an ACH credit from Region 16. That payment was 96.8% of all April collections and 48% of every dollar the company collected between April and July.
      - paragraph [ref=f2e167]: The next Conroe cash event is the March 2027 renewal. No forward scenario in this package can rely on Conroe. The recognised-revenue line above is an accounting artefact, not money arriving.
