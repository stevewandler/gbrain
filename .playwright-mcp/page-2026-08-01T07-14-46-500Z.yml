    - heading "Cross-check against live HubSpot" [level=3] [ref=f2e1255]
    - paragraph [ref=f2e1256]: The figures above come from the 28 July spreadsheet. We also pulled the CRM directly, live, on 31 July. The two disagree on the headline and agree almost exactly on the number that matters.
    - generic [ref=f2e1257]:
      - generic [ref=f2e1258]:
        - generic [ref=f2e1259]: HubSpot open pipeline
        - generic [ref=f2e1260]: $2,482,621
        - generic [ref=f2e1261]: 145 open deals across 11 pipelines. 2.5× the spreadsheet's $983,444.
      - generic [ref=f2e1262]:
        - generic [ref=f2e1263]: One Utah deal
        - generic [ref=f2e1264]: 52.9%
        - generic [ref=f2e1265]: "\"Utah State Education Agency\" is $1,312,622 of that total — at Qualifying, 10% probability, closing Jan 2027. It is absent from the spreadsheet entirely."
      - generic [ref=f2e1266]:
        - generic [ref=f2e1267]: Inside the 60-day cash window
        - generic [ref=f2e1268]: $181,628
        - generic [ref=f2e1269]: 113 deals, $635,322 gross, weighted at stage probability.
      - generic [ref=f2e1270]:
        - generic [ref=f2e1271]: …and at ≥50% probability
        - generic [ref=f2e1272]: $137,425
        - generic [ref=f2e1273]: Just 20 deals, $209,404 gross. This is the credible near-term number.
    - generic [ref=f2e1274]:
      - heading "Two independent systems converge on the same answer" [level=4] [ref=f2e1275]
      - paragraph [ref=f2e1276]: The spreadsheet's weighted collections forecast for August and September totals $131,046. HubSpot's live pipeline, filtered to deals inside the 60-day window at 50% probability or better, totals $137,425. Two different systems, two different probability models, built by different people — $6,379 apart, a 5% difference.
      - paragraph [ref=f2e1277]: That convergence is worth more than either figure alone. It means roughly $135,000 of collections in the runway window is a defensible planning number, and the $2,482,621 gross CRM figure is not. Anyone presenting the gross number without this decomposition would materially overstate liquidity.
    - generic [ref=f2e1278]:
      - heading "Pipeline hygiene issues that distort the CRM totals" [level=4] [ref=f2e1279]
      - paragraph [ref=f2e1280]: 39% of open deals carry a $0 or null amount — 56 of 145, concentrated in the ESC 15 and ESC 9 consortium pipelines, which are effectively unvalued. "Parked/Revisit" is configured as open in the 26/27 Renewals pipeline but closed elsewhere, dragging $81,775 of parked deals — including Killeen ($39,073) and Belton ($24,982) — into every open-pipeline report. Five deals carry close dates already in the past.
      - paragraph [ref=f2e1281]: "One genuinely positive signal: not a single open deal has gone more than 30 days without modification. The CRM is actively maintained; it is the configuration that is off, not the discipline."
    - generic [ref=f2e1282]:
      - heading "Garland is still live in HubSpot at 65%" [level=4] [ref=f2e1283]
      - paragraph [ref=f2e1284]: The CRM carries Garland ISD at $140,391, stage Quote Sent, 65% probability, close date 15 September, last modified 28 July. The spreadsheet carries it at 20%. The CEO reports it lost. Three systems, three different answers on the largest near-term deal in the company. This one record needs resolving before anything else in this section can be relied on.
    - generic [ref=f2e1285]:
      - generic [ref=f2e1286]:
        - generic [ref=f2e1287]: Ageing
        - generic [ref=f2e1288]: "33"
        - generic [ref=f2e1289]: of 75 open deals were created before 2026. The oldest dates to September 2024.
      - generic [ref=f2e1290]:
        - generic [ref=f2e1291]: Concentration
        - generic [ref=f2e1292]: 61%
        - generic [ref=f2e1293]: of gross pipeline sits in 10 deals. Losing two of them moves the forecast materially — as Garland and Midland just showed.
      - generic [ref=f2e1294]:
        - generic [ref=f2e1295]: August cliff
        - generic [ref=f2e1296]: $523,941
        - generic [ref=f2e1297]: 54 deals carry an August close date. Most are renewals still in Qualifying, which the model scores at zero.
  - generic [ref=f2e1299]:
    - generic [ref=f2e1300]: Section 4
    - heading "Five paths, priced" [level=2] [ref=f2e1301]
    - paragraph [ref=f2e1302]: Pick a scenario to see the monthly cash bridge. Then use the controls to change the assumptions yourself — the model recomputes live. August and September in the status-quo case reproduce the published bridge exactly; everything past September is projection.
    - generic [ref=f2e1303]:
      - heading "This model was validated against the CFO's numbers, not copied from them" [level=4] [ref=f2e1304]
      - paragraph [ref=f2e1305]: The cost stack driving every scenario was rebuilt from the underlying line items — person by person in E-Exp, tool by tool in E-Exp-SaaS, vendor by vendor in Def Exp. Run forward, that independent rebuild lands on $57,667 of August cash and −$1,195 of September cash. The CFO's published bridge says $57,667 and −$1,195.
      - paragraph [ref=f2e1306]: "The two agree to within one cent across both months, and the single reconciling item is the $13,500 severance presentation described in Section 8. That is the basis for trusting the forward projections: the machinery reproduces the known months exactly before it is asked to predict the unknown ones."
