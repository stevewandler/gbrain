# gbrain-steve-v2 — Steve's founder-brain schema pack
#
# Extends gbrain-base-v2 (15-type DRY/MECE canonical) with 2 additions
# for a founder's knowledge primitives: meeting + personal.
#
# Design principles:
#   1. Stay as close to gbrain-base-v2 as possible — only add what
#      has genuine structural semantics, not what's just a directory.
#   2. Every type must serve one of: expert routing, extraction gating,
#      search filtering with real utility, or structural/timeline semantics.
#   3. <20 pages → don't codify; 20-100 → alias; 100+ → first-class type.
#
# Additions beyond v2:
#   - meeting (temporal, 1,576 pages): timeline integration, participant
#     routing, action-item tracking. v2 has email + slack but no meeting.
#   - personal (concept, 1,210 pages): privacy-scoped, extraction-gated.
#     The autopilot skips personal-sensitive source — the type enforces this.
#
# Collapsed into note (v2 catch-all):
#   - ideas (1,078 pages) → note subtype:idea path_prefix:wiki/originals/ideas/
#   - reflections (924 pages) → note subtype:reflection path_prefix:wiki/personal/reflections/
#   - originals, synthesis, library, ops, inbox, infrastructure, growth,
#     research, agents, reading, guide, team-shared, reference → note
#   - drive/ → source (v2 native), wiki/people/ → person (v2 native),
#     wiki/concepts/ → concept (v2 native)
#
# Mapping rules: retype ~43 junk types from gbrain-base era → note
# with legacy_type preserved for rollback.

api_version: gbrain-schema-pack-v1
name: gbrain-steve-v2
version: 1.0.0
description: Steve's founder-brain pack. 15 v2 canonicals + meeting + personal = 17 types. Successor to gbrain-base-v2.
gbrain_min_version: 0.42.0
extends: null
borrow_from: []
takes_kinds:
  - fact
  - take
  - bet
  - hunch

migration_from:
  pack: gbrain-base-v2
  version: "1.x"

page_types:
  # ── v2 canonicals (unchanged) ──────────────────────────────────────

  - name: person
    primitive: entity
    path_prefixes:
      - people/
      - person/
      - wiki/people/
    aliases:
      - people
      - contact
      - individual
      - founder
      - partner
      - partner-profile
    extractable: false
    expert_routing: true

  - name: company
    primitive: entity
    path_prefixes:
      - companies/
      - company/
      - products/
      - orgs/
    subtypes:
      - name: company
        when:
          path_pattern: "^companies/"
      - name: product
        when:
          path_pattern: "^products/"
      - name: org
        when:
          path_pattern: "^orgs/"
    aliases:
      - yc-company
      - product
      - org
      - people-org
      - organization
      - startup
      - business
    extractable: false
    expert_routing: true

  - name: media
    primitive: media
    path_prefixes:
      - media/
      - videos/
      - articles/
      - essays/
      - books/
      - podcasts/
      - blog/
      - posts/
    subtypes:
      - name: video
        when:
          path_pattern: "^videos/"
      - name: article
        when:
          path_pattern: "^articles/"
      - name: essay
        when:
          path_pattern: "^essays/"
      - name: book
        when:
          path_pattern: "^books/"
      - name: podcast
        when:
          path_pattern: "^podcasts/"
      - name: blog
        when:
          path_pattern: "^(blog|posts)/"
    aliases:
      - article
      - video
      - essay
      - book
      - podcast
      - blog-post
      - youtube-video
      - podcast-episode
      - interview
    extractable: true
    expert_routing: false

  - name: tweet
    primitive: media
    path_prefixes:
      - tweets/
      - twitter/
    subtypes:
      - name: single
        when:
          frontmatter_field: thread_length
          frontmatter_value: 1
      - name: bundle
        when:
          frontmatter_field: bundle
          frontmatter_value: true
      - name: stub
        when:
          frontmatter_field: stub
          frontmatter_value: true
    aliases:
      - tweet-single
      - tweet-thread
      - tweet-bundle
      - tweet-stub
      - twitter-post
    extractable: true
    expert_routing: false

  - name: social-digest
    primitive: temporal
    path_prefixes:
      - digests/social/
    subtypes:
      - name: daily
        when:
          path_pattern: "/daily/"
      - name: monthly
        when:
          path_pattern: "/monthly/"
    aliases:
      - social-digest-daily
      - social-digest-monthly
    extractable: false
    expert_routing: false

  - name: analysis
    primitive: media
    path_prefixes:
      - wiki/analysis/
      - analysis/
    aliases:
