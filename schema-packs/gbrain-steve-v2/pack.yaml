    extractable: true
    expert_routing: false

  - name: slack
    primitive: temporal
    path_prefixes:
      - slack/
    aliases:
      - slack-message
      - slack-thread
    extractable: true
    expert_routing: false

  - name: writing
    primitive: media
    path_prefixes:
      - writing/
    aliases:
      - draft
      - post-draft
    extractable: true
    expert_routing: false

  - name: project
    primitive: concept
    path_prefixes:
      - projects/
      - project/
    aliases:
      - initiative
      - workstream
    extractable: false
    expert_routing: false

  # ── Steve's additions ──────────────────────────────────────────────

  - name: meeting
    primitive: temporal
    path_prefixes:
      - meetings/
      - meeting/
    subtypes:
      - name: standup
        when:
          path_pattern: "stand"
      - name: one-on-one
        when:
          path_pattern: "1-1|one-on-one"
      - name: sync
        when:
          path_pattern: "sync"
    aliases:
      - standup
      - sync
      - call
      - session
    extractable: true
    expert_routing: false

  - name: personal
    primitive: concept
    path_prefixes:
      - personal/
    subtypes:
      - name: memory
        when:
          path_pattern: "^personal/memory/"
      - name: reflection
        when:
          path_pattern: "^personal/reflections/"
      - name: drive-archive
        when:
          path_pattern: "^personal/drive-archive/"
    aliases:
      - personal-note
      - private
    extractable: false
    expert_routing: false

  # ── Catch-all ──────────────────────────────────────────────────────

  - name: note
    primitive: concept
    path_prefixes:
      - notes/
      - note/
      - wiki/originals/ideas/
      - wiki/originals/
      - wiki/personal/reflections/
      - wiki/personal/patterns/
      - ideas/
      - reflections/
      - originals/
      - synthesis/
      - ops/
      - inbox/
      - infrastructure/
      - growth/
      - research/
      - agents/
      - reading/
      - guide/
      - reference/
      - team-shared/
      - dream-cycle-summaries/
      - library/
      - extracts/
      - intel/
      - ceo-private/
      - inputs/
      - bookmarked-strategy/
      - growth-library/
    subtypes:
      - name: idea
        when:
          path_pattern: "(wiki/originals/)?ideas/"
      - name: reflection
        when:
          path_pattern: "(wiki/personal/)?reflections/"
      - name: pattern
        when:
          path_pattern: "patterns/"
      - name: ops
        when:
          path_pattern: "^ops/"
      - name: synthesis
        when:
          path_pattern: "^synthesis/"
      - name: library
        when:
          path_pattern: "^library/"
      - name: strategy
        when:
          path_pattern: "strategy/"
      - name: growth
        when:
          path_pattern: "^growth/"
    aliases:
      - memo
      - anecdote
      - insight
      - principle
      - framework
      - idea
      - reflection
      - thought
      - pattern
      - original
      - original-content
      - extract-receipt
    extractable: true
    expert_routing: false

